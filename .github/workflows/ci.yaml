name: test

on:
  workflow_dispatch:
  push: {}
  pull_request: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Start postgres
        run: |
           docker compose up -d 
            sleep 15 
            docker ps

      - name: Start keycloack
        run: |
          docker run -d \
          --name keycloak \
          -p 8080:8080 \
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
          -e KC_FEATURES=token-exchange,admin-fine-grained-authz  \
          quay.io/keycloak/keycloak:26.1.3 start-dev
          
          echo "Waiting for Keycloak to start..."
          sleep 30
          docker ps -a
          docker logs keycloak

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}"
          restore-keys: "${{ runner.os }}-m2-"

      - name: Run tests with Maven
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gymsession
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_URL: http://localhost:8080

      - name: Build JAR with Maven
        run: mvn -B package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymsession.jar
          path: target/*.jar

      - name: Stop containers
        if: always()
        run: | 
           docker compose down
           docker stop keycloak || true
           docker rm keycloak || true