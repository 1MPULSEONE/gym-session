name: test

on:
  workflow_dispatch:
  push: {}
  pull_request: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Start postgres
        run: |
           docker compose up -d 
            sleep 15 
            docker ps

      - name: Start keycloack
        run: |
          docker run -d \
          --name keycloak \
          -p 8080:8080 \
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
          -e KC_FEATURES=token-exchange,admin-fine-grained-authz  \
          quay.io/keycloak/keycloak:26.1.3 start-dev
          
      - name: Wait for Keycloak to be healthy
        run: |
          echo "Waiting for Keycloak to start..."
          timeout 300s bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/health/ready)" != "200" ]]; do echo -n "."; sleep 20; done'
          echo "Keycloak is ready!"
          docker ps -a
          docker logs keycloak

      - name: Configure Keycloak Realm and Client Secret
        id: configure-keycloak
        run: |
          REALM_FILE_PATH="keycloak/develop-realm.json"
          KEYCLOAK_CONTAINER_NAME="keycloak"
          REALM_NAME="develop"
          CLIENT_ID_NAME="gymsession-rest-api"
          ADMIN_USER="admin"
          ADMIN_PASSWORD="admin"
          
          echo "Copying realm file to Keycloak container..."
          docker cp "$REALM_FILE_PATH" "$KEYCLOAK_CONTAINER_NAME:/tmp/realm.json"
          
          echo "Executing configuration script inside Keycloak container..."
          docker exec "$KEYCLOAK_CONTAINER_NAME" /bin/bash <<EOF
          set -e
          
          KCADM_CMD="/opt/keycloak/bin/kcadm.sh"
          
          echo "Logging into Keycloak Admin CLI..."
          \$KCADM_CMD config credentials --server http://localhost:8080 --realm master --user "$ADMIN_USER" --password "$ADMIN_PASSWORD"
          
          echo "Importing/Updating realm '$REALM_NAME'..."
          \$KCADM_CMD delete realms/$REALM_NAME || echo "Realm '$REALM_NAME' not found, proceeding to create."
          \$KCADM_CMD create realms -f /tmp/realm.json -s enabled=true
          
          echo "Getting internal client ID for '$CLIENT_ID_NAME'..."
          INTERNAL_CLIENT_ID=\$(\$KCADM_CMD get clients -r "$REALM_NAME" --query clientId="$CLIENT_ID_NAME" --fields id --format csv --noquotes | grep -v '^id$' | head -n 1)
          
          if [ -z "\$INTERNAL_CLIENT_ID" ]; then
            echo "ERROR: Client '$CLIENT_ID_NAME' not found in realm '$REALM_NAME' after import!"
            exit 1
          fi
          echo "Internal Client ID: \$INTERNAL_CLIENT_ID"
          echo "Getting/Regenerating client secret for '$CLIENT_ID_NAME'..."
          
          SECRET_JSON=\$(\$KCADM_CMD regenerate-secret clients/\$INTERNAL_CLIENT_ID -r "$REALM_NAME")

          echo "Extracting secret value..."
          # Если есть jq: CLIENT_SECRET=\$(echo \$SECRET_JSON | jq -r '.value')
          CLIENT_SECRET=\$(echo \$SECRET_JSON | grep -o '"value":"[^"]*"' | cut -d'"' -f4)


          if [ -z "\$CLIENT_SECRET" ]; then
            echo "ERROR: Failed to extract client secret!"
            echo "Secret JSON was: \$SECRET_JSON"
            exit 1
          fi

          echo "Exporting generated secret to GITHUB_ENV..."
          
          echo "::add-mask::\$CLIENT_SECRET"
          echo "KEYCLOAK_GENERATED_SECRET=\$CLIENT_SECRET" >> \$GITHUB_ENV

          echo "Keycloak configuration finished successfully."
          EOF

      - name: Start ELK stack
        run: |
          cd elk
          docker compose up -d
          sleep 30  # Даем время для инициализации ELK
          docker ps
          curl -X GET "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}"
          restore-keys: "${{ runner.os }}-m2-"

      - name: Run tests with Maven
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gymsession
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          KEYCLOAK_CLIENT_SECRET: ${{ env.KEYCLOAK_GENERATED_SECRET }}
          KEYCLOAK_URL: http://localhost:8080

      - name: Build JAR with Maven
        run: mvn -B package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gymsession
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          KEYCLOAK_CLIENT_SECRET: ${{ env.KEYCLOAK_GENERATED_SECRET }}
          KEYCLOAK_URL: http://localhost:8080

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymsession.jar
          path: target/*.jar

      - name: Check ELK logs
        if: always()
        run: |
            docker logs logstash_springboot
            curl -X GET "http://localhost:9200/_cat/indices?v"

      - name: Stop containers
        if: always()
        run: | 
           docker compose down
           docker stop keycloak || true
           docker rm keycloak || true